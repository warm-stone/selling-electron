name: Release

# 正式发布流程：git tag v* → push tag → 全质量门通过后自动发布到 GitHub Releases
# （日常 push 无 CI——旧 ci.yml 已停用留档 ci.yml.bak）
on:
  push:
    tags: ['v*']

# 创建 GitHub Release 需要写权限（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

# 同一 tag 的 run 严格排队（防 re-run 与新 push 并发竞争 release 资产）
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 质量门（typecheck + vitest + E2E，目标平台）──
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: E2E tests (Playwright _electron)
        run: npm run test:e2e

  # ── 构建 + 发布到 GitHub Releases ──
  # 发布不走 electron-builder --publish：v26.x 全系（至 26.18.1）存在并发 publisher
  # 竞态（上游 issue #10026，修复仅落在 27.0.0-alpha 线）——单次构建的多个 artifact
  # 并发触发 getOrCreatePublisher，各建实例各查各建 release → 同 tag 双 draft、
  # exe 与 blockmap 分流两个 draft（v0.3.0 真机实证）。改用 --publish never 产包 +
  # gh CLI 幂等发布（单执行者、view||create 兜底、--clobber 覆盖重传），发布语义
  # 完全可控。
  release:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 防呆：tag 名必须与 package.json version 对应（v0.1.0 ↔ version 0.1.0），
      # 否则 Release 版本号与安装包实际版本不一致
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME != package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Build app (electron-vite)
        run: npm run build

      # 清理同 tag 的历史 draft（v0.3.0 竞态残留的处置 + 未来 re-run 幂等保障）：
      # 只删 draft，published release 不受影响
      - name: Clean stale draft releases for this tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.draft and .tag_name == \"${{ github.ref_name }}\") | .id"); do
            echo "deleting stale draft release id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done

      - name: Build installer (publishing handled by gh CLI)
        run: npx electron-builder --win nsis --publish never

      # 幂等发布：view 命中（re-run 场景）则复用，否则 create draft；
      # upload --clobber 覆盖同名资产。GH_TOKEN 为 Actions 运行时内置
      # GITHUB_TOKEN（发布到本仓库 Releases，无需手动密钥）。
      # shell 用 bash：gh 自行展开 glob + 规避 PowerShell 引号坑（产物名为
      # ASCII 的 selling-electron-setup-*.exe，无中文编码问题）。
      - name: Create draft release & upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --generate-notes
          gh release upload "$TAG" release/*.exe release/*.exe.blockmap --clobber
